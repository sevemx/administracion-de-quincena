<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Presupuesto Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #2c3e50; }
        .card { margin-bottom: 20px; padding: 20px; border: 1px solid #e1e8ed; border-radius: 8px; background-color: #fafbfc; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        button { background-color: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        
        .btn-whatsapp { background-color: #25D366; }
        .btn-whatsapp:hover { background-color: #1ebe57; }
        .btn-export { background-color: #27ae60; }
        .btn-income { background-color: #f39c12; }
        .btn-danger { background-color: #e74c3c; }

        .summary { display: flex; justify-content: space-around; flex-wrap: wrap; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; font-size: 18px; margin-top: 10px; }
        .summary div { min-width: 150px; margin-bottom: 10px; }
        .summary div span { display: block; font-size: 24px; font-weight: bold; margin-top: 5px; }
        .text-success { color: #27ae60; }
        .text-danger { color: #c0392b; }
        .text-primary { color: #2980b9; }
        .text-warning { color: #f39c12; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #3498db; color: white; }
        .hidden { display: none; }
        .chart-container { position: relative; height: 300px; width: 100%; display: flex; justify-content: center; }
        
        #alerta-presupuesto { padding: 10px; background-color: #f8d7da; color: #721c24; border-radius: 5px; text-align: center; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Administrador de Presupuesto Pro</h1>

    <!-- Configuración Inicial -->
    <div class="card" id="setup-section">
        <h2>Configuración Inicial</h2>
        <label for="budget-amount">Presupuesto Inicial ($):</label>
        <input type="number" id="budget-amount" placeholder="Ej. 5000" min="0">

        <label for="budget-period">Plazo del Presupuesto:</label>
        <select id="budget-period">
            <option value="Semanal">Semanal</option>
            <option value="Quincenal">Quincenal</option>
            <option value="Mensual">Mensual</option>
        </select>

        <button onclick="iniciarPresupuesto()">Iniciar Presupuesto</button>
    </div>

    <!-- Panel Principal -->
    <div id="dashboard-section" class="hidden">
        
        <div id="alerta-presupuesto" class="hidden">¡Alerta! Has superado el 80% de tu presupuesto.</div>

        <div class="summary">
            <div>Presupuesto <span id="period-display" style="font-size: 14px; font-weight: normal; color: #7f8c8d;"></span><br>
                <span id="display-budget" class="text-primary">$0.00</span>
            </div>
            <div>Gastado<br><span id="display-expenses" class="text-danger">$0.00</span></div>
            <div>Restante<br><span id="display-balance" class="text-success">$0.00</span></div>
        </div>

        <div class="grid-2" style="margin-top: 20px;">
            <!-- Formulario de Gastos -->
            <div class="card">
                <h2>Registrar Gasto</h2>
                <input type="text" id="expense-desc" placeholder="Descripción (Ej. Cine)">
                <input type="number" id="expense-amount" placeholder="Monto ($)" min="0">
                <select id="expense-category">
                    <option value="Alimentación">Alimentación</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Servicios">Servicios</option>
                    <option value="Entretenimiento">Entretenimiento</option>
                    <option value="Salud">Salud</option>
                    <option value="Otros">Otros</option>
                </select>
                <select id="expense-method">
                    <option value="Efectivo">Efectivo</option>
                    <option value="Transferencia">Transferencia</option>
                    <option value="Tarjeta de Débito">Tarjeta de Débito</option>
                    <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                </select>
                <button onclick="agregarGasto()">Agregar Gasto</button>
                <button class="btn-income" onclick="agregarIngresoExtra()">+ Agregar Ingreso Extra</button>
            </div>

            <!-- Gráfico -->
            <div class="card">
                <h2>Distribución de Gastos</h2>
                <div class="chart-container">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Acciones Extra -->
        <div class="grid-2">
            <button class="btn-whatsapp" onclick="compartirWhatsApp()">📲 Compartir en WhatsApp</button>
            <button class="btn-export" onclick="exportarCSV()">📥 Descargar Historial (Excel/CSV)</button>
        </div>

        <div class="card">
            <h2>Historial</h2>
            <input type="text" id="search-filter" placeholder="🔍 Buscar gasto..." onkeyup="filtrarTabla()">
            <table>
                <thead>
                    <tr>
                        <th>Descripción</th>
                        <th>Categoría</th>
                        <th>Método</th>
                        <th>Monto</th>
                    </tr>
                </thead>
                <tbody id="expense-list"></tbody>
            </table>
        </div>
        <button class="btn-danger" onclick="reiniciarApp()">⚠️️ Reiniciar Todo</button>
    </div>
</div>

<script>
    let appData = { presupuestoTotal: 0, gastosTotales: 0, gastos: [], periodo: '' };
    let miGrafico;

    // Cargar datos al iniciar la página
    window.onload = function() {
        const datosGuardados = localStorage.getItem('appPresupuestoData');
        if (datosGuardados) {
            appData = JSON.parse(datosGuardados);
            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('period-display').innerText = `(${appData.periodo})`;
            actualizarUI();
        }
    };

    function guardarDatos() {
        localStorage.setItem('appPresupuestoData', JSON.stringify(appData));
    }

    function iniciarPresupuesto() {
        const monto = parseFloat(document.getElementById('budget-amount').value);
        appData.periodo = document.getElementById('budget-period').value;

        if (isNaN(monto) || monto <= 0) { alert("Ingresa un presupuesto válido."); return; }

        appData.presupuestoTotal = monto;
        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        document.getElementById('period-display').innerText = `(${appData.periodo})`;
        
        guardarDatos();
        actualizarUI();
    }

    function agregarGasto() {
        const desc = document.getElementById('expense-desc').value;
        const monto = parseFloat(document.getElementById('expense-amount').value);
        const categoria = document.getElementById('expense-category').value;
        const metodo = document.getElementById('expense-method').value;

        if (desc.trim() === '' || isNaN(monto) || monto <= 0) {
            alert("Completa la descripción y el monto."); return;
        }

        appData.gastos.push({ desc, monto, categoria, metodo, fecha: new Date().toLocaleDateString() });
        appData.gastosTotales += monto;

        document.getElementById('expense-desc').value = '';
        document.getElementById('expense-amount').value = '';

        guardarDatos();
        actualizarUI();
    }

    function agregarIngresoExtra() {
        const extra = parseFloat(prompt("Ingresa el monto del ingreso extra:"));
        if (!isNaN(extra) && extra > 0) {
            appData.presupuestoTotal += extra;
            guardarDatos();
            actualizarUI();
        }
    }

    function actualizarUI() {
        const saldoRestante = appData.presupuestoTotal - appData.gastosTotales;

        document.getElementById('display-budget').innerText = `$${appData.presupuestoTotal.toFixed(2)}`;
        document.getElementById('display-expenses').innerText = `$${appData.gastosTotales.toFixed(2)}`;
        
        const balanceElement = document.getElementById('display-balance');
        balanceElement.innerText = `$${saldoRestante.toFixed(2)}`;
        
        const alerta = document.getElementById('alerta-presupuesto');
        alerta.classList.add('hidden');

        if (saldoRestante < 0) {
            balanceElement.className = 'text-danger';
            alerta.innerText = "¡Alerta! Has excedido tu presupuesto.";
            alerta.classList.remove('hidden');
        } else if (appData.gastosTotales >= appData.presupuestoTotal * 0.8) {
            balanceElement.className = 'text-warning';
            alerta.innerText = "¡Cuidado! Has consumido más del 80% de tu presupuesto.";
            alerta.classList.remove('hidden');
        } else {
            balanceElement.className = 'text-success';
        }

        renderizarTabla(appData.gastos);
        actualizarGrafico();
    }

    function renderizarTabla(listaGastos) {
        const lista = document.getElementById('expense-list');
        lista.innerHTML = '';
        listaGastos.forEach(gasto => {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${gasto.desc}</td><td>${gasto.categoria}</td><td>${gasto.metodo}</td><td class="text-danger">-$${gasto.monto.toFixed(2)}</td>`;
            lista.appendChild(row);
        });
    }

    function filtrarTabla() {
        const filtro = document.getElementById('search-filter').value.toLowerCase();
        const filtrados = appData.gastos.filter(g => g.desc.toLowerCase().includes(filtro) || g.categoria.toLowerCase().includes(filtro));
        renderizarTabla(filtrados);
    }

    function actualizarGrafico() {
        const categorias = {};
        appData.gastos.forEach(g => {
            categorias[g.categoria] = (categorias[g.categoria] || 0) + g.monto;
        });

        const ctx = document.getElementById('expenseChart').getContext('2d');
        if (miGrafico) { miGrafico.destroy(); } // Destruir gráfico anterior para redibujar

        miGrafico = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(categorias),
                datasets: [{
                    data: Object.values(categorias),
                    backgroundColor: ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6', '#34495e']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function compartirWhatsApp() {
        const saldoRestante = appData.presupuestoTotal - appData.gastosTotales;
        let texto = `📊 *Resumen de mi Presupuesto ${appData.periodo}*%0A`;
        texto += `💰 Total Asignado: $${appData.presupuestoTotal.toFixed(2)}%0A`;
        texto += `📉 Total Gastado: $${appData.gastosTotales.toFixed(2)}%0A`;
        texto += `💵 Saldo Restante: $${saldoRestante.toFixed(2)}%0A%0A`;
        texto += `_Administrado desde mi Web App Personal_ 🚀`;

        window.open(`https://api.whatsapp.com/send?text=${texto}`, '_blank');
    }

    function exportarCSV() {
        let csv = "Descripcion,Categoria,Metodo_Pago,Monto,Fecha\n";
        appData.gastos.forEach(g => {
            csv += `"${g.desc}","${g.categoria}","${g.metodo}",${g.monto},"${g.fecha}"\n`;
        });
        
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "historial_gastos.csv";
        link.click();
    }

    function reiniciarApp() {
        if(confirm("¿Seguro que deseas borrar todos tus datos de forma permanente?")) {
            localStorage.removeItem('appPresupuestoData');
            location.reload(); // Recargar la página limpia
        }
    }
</script>

</body>
</html>
