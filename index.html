<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Presupuesto Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Importar fuente moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4e54c8;
            --secondary: #8f94fb;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --dark: #2c3e50;
            --light: #f4f7f6;
            --white: #ffffff;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0; 
            padding: 20px; 
            color: var(--dark); 
            min-height: 100vh;
        }
        
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            backdrop-filter: blur(10px);
        }
        
        h1, h2 { text-align: center; color: var(--dark); font-weight: 700; }
        h1 { font-size: 2.2rem; margin-bottom: 30px; }
        
        .card { 
            margin-bottom: 20px; 
            padding: 25px; 
            border: none; 
            border-radius: 12px; 
            background-color: var(--white);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); }

        label { display: block; margin: 10px 0 5px; font-weight: 600; font-size: 0.9rem; color: #555; }
        
        input, select, button { 
            width: 100%; 
            padding: 12px 15px; 
            margin-bottom: 15px; 
            border-radius: 8px; 
            border: 1px solid #ddd; 
            box-sizing: border-box; 
            font-size: 1rem; 
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }
        
        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 8px rgba(78, 84, 200, 0.2);
        }

        button { 
            background: linear-gradient(45deg, var(--primary), var(--secondary)); 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: 600; 
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(78, 84, 200, 0.3);
        }
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(78, 84, 200, 0.4); 
        }
        
        .btn-whatsapp { background: linear-gradient(45deg, #25D366, #128C7E); box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
        .btn-export { background: linear-gradient(45deg, #27ae60, #2ecc71); box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3); }
        .btn-income { background: linear-gradient(45deg, #f39c12, #f1c40f); box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3); color: #fff;}
        .btn-danger { background: linear-gradient(45deg, #c0392b, #e74c3c); box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3); margin-top: 30px;}

        .summary { 
            display: flex; 
            justify-content: space-around; 
            flex-wrap: wrap; 
            background: var(--white); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            text-align: center; 
            margin-top: 10px; 
        }
        .summary div { min-width: 150px; margin-bottom: 10px; padding: 10px; }
        .summary div span { display: block; font-size: 1.8rem; font-weight: 700; margin-top: 8px; }
        
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-primary { color: var(--primary); }
        .text-warning { color: var(--warning); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: var(--white); border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: var(--dark); font-weight: 600; text-transform: uppercase; font-size: 0.85rem; }
        tr:hover { background-color: #fcfcfc; }
        
        .hidden { display: none !important; }
        .chart-container { position: relative; height: 320px; width: 100%; display: flex; justify-content: center; }
        
        #alerta-presupuesto { 
            padding: 15px; 
            background-color: #fdf3f4; 
            color: #d63031; 
            border-left: 5px solid #d63031;
            border-radius: 8px; 
            text-align: left; 
            margin-bottom: 20px; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Mi Presupuesto Pro</h1>

    <!-- Configuración Inicial -->
    <div class="card" id="setup-section">
        <h2>🎯 Configura tu meta</h2>
        <label for="budget-amount">💰 Presupuesto Inicial ($):</label>
        <input type="number" id="budget-amount" placeholder="Ej. 5000" min="0">

        <label for="budget-period">📅 Plazo del Presupuesto:</label>
        <select id="budget-period">
            <option value="Semanal">Semanal</option>
            <option value="Quincenal">Quincenal</option>
            <option value="Mensual">Mensual</option>
        </select>

        <button onclick="iniciarPresupuesto()">✨ Iniciar Aventura Financiera</button>
    </div>

    <!-- Panel Principal -->
    <div id="dashboard-section" class="hidden">
        
        <div id="alerta-presupuesto" class="hidden">
            <span>⚠️</span> <span id="texto-alerta">¡Alerta! Has superado el 80% de tu presupuesto.</span>
        </div>

        <div class="summary">
            <div>
                <span style="font-size: 1rem; color: #7f8c8d;">🏦 Presupuesto</span> 
                <span id="period-display" style="font-size: 0.8rem; font-weight: normal; color: #95a5a6;"></span>
                <span id="display-budget" class="text-primary">$0.00</span>
            </div>
            <div>
                <span style="font-size: 1rem; color: #7f8c8d;">📉 Gastado</span>
                <span id="display-expenses" class="text-danger">$0.00</span>
            </div>
            <div>
                <span style="font-size: 1rem; color: #7f8c8d;">💵 Restante</span>
                <span id="display-balance" class="text-success">$0.00</span>
            </div>
        </div>

        <div class="grid-2" style="margin-top: 25px;">
            <!-- Formulario de Gastos -->
            <div class="card">
                <h2>💸 Nuevo Movimiento</h2>
                <input type="text" id="expense-desc" placeholder="📝 Descripción (Ej. Supermercado)">
                <input type="number" id="expense-amount" placeholder="💲 Monto ($)" min="0">
                <select id="expense-category">
                    <option value="🍔 Alimentación">🍔 Alimentación</option>
                    <option value="🚌 Transporte">🚌 Transporte</option>
                    <option value="💡 Servicios">💡 Servicios (Agua, Luz)</option>
                    <option value="🎬 Entretenimiento">🎬 Entretenimiento</option>
                    <option value="💊 Salud">💊 Salud</option>
                    <option value="🛒 Otros">🛒 Otros</option>
                </select>
                <select id="expense-method">
                    <option value="💵 Efectivo">💵 Efectivo</option>
                    <option value="📱 Transferencia">📱 Transferencia</option>
                    <option value="💳 Débito">💳 Tarjeta de Débito</option>
                    <option value="💳 Crédito">💳 Tarjeta de Crédito</option>
                </select>
                <button onclick="agregarGasto()">➕ Registrar Gasto</button>
                <button class="btn-income" onclick="agregarIngresoExtra()">🤑 Recibí un Ingreso Extra</button>
            </div>

            <!-- Gráfico -->
            <div class="card">
                <h2>📊 ¿En qué estás gastando?</h2>
                <div class="chart-container">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Acciones Extra -->
        <div class="grid-2">
            <button class="btn-whatsapp" onclick="compartirWhatsApp()">📲 Compartir Resumen por WhatsApp</button>
            <button class="btn-export" onclick="exportarCSV()">📥 Descargar a Excel (.csv)</button>
        </div>

        <div class="card">
            <h2>🧾 Historial de Gastos</h2>
            <input type="text" id="search-filter" placeholder="🔍 Buscar por nombre o categoría..." onkeyup="filtrarTabla()">
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Descripción</th>
                            <th>Categoría</th>
                            <th>Método</th>
                            <th>Monto</th>
                        </tr>
                    </thead>
                    <tbody id="expense-list"></tbody>
                </table>
            </div>
        </div>
        <button class="btn-danger" onclick="reiniciarApp()">🗑️ Borrar todo y empezar de cero</button>
    </div>
</div>

<script>
    let appData = { presupuestoTotal: 0, gastosTotales: 0, gastos: [], periodo: '' };
    let miGrafico;

    window.onload = function() {
        const datosGuardados = localStorage.getItem('appPresupuestoPro');
        if (datosGuardados) {
            appData = JSON.parse(datosGuardados);
            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('period-display').innerText = `(${appData.periodo})`;
            actualizarUI();
        }
    };

    function guardarDatos() {
        localStorage.setItem('appPresupuestoPro', JSON.stringify(appData));
    }

    function iniciarPresupuesto() {
        const monto = parseFloat(document.getElementById('budget-amount').value);
        appData.periodo = document.getElementById('budget-period').value;

        if (isNaN(monto) || monto <= 0) { alert("⚠️ Ingresa un presupuesto válido."); return; }

        appData.presupuestoTotal = monto;
        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        document.getElementById('period-display').innerText = `(${appData.periodo})`;
        
        guardarDatos();
        actualizarUI();
    }

    function agregarGasto() {
        const desc = document.getElementById('expense-desc').value;
        const monto = parseFloat(document.getElementById('expense-amount').value);
        const categoria = document.getElementById('expense-category').value;
        const metodo = document.getElementById('expense-method').value;

        if (desc.trim() === '' || isNaN(monto) || monto <= 0) {
            alert("⚠️ Por favor, completa la descripción y el monto."); return;
        }

        appData.gastos.unshift({ desc, monto, categoria, metodo, fecha: new Date().toLocaleDateString() });
        appData.gastosTotales += monto;

        document.getElementById('expense-desc').value = '';
        document.getElementById('expense-amount').value = '';

        guardarDatos();
        actualizarUI();
    }

    function agregarIngresoExtra() {
        const extra = parseFloat(prompt("💰 Ingresa el monto del ingreso extra:"));
        if (!isNaN(extra) && extra > 0) {
            appData.presupuestoTotal += extra;
            guardarDatos();
            actualizarUI();
        }
    }

    function actualizarUI() {
        const saldoRestante = appData.presupuestoTotal - appData.gastosTotales;

        document.getElementById('display-budget').innerText = `$${appData.presupuestoTotal.toLocaleString('es-MX', {minimumFractionDigits: 2})}`;
        document.getElementById('display-expenses').innerText = `$${appData.gastosTotales.toLocaleString('es-MX', {minimumFractionDigits: 2})}`;
        
        const balanceElement = document.getElementById('display-balance');
        balanceElement.innerText = `$${saldoRestante.toLocaleString('es-MX', {minimumFractionDigits: 2})}`;
        
        const alerta = document.getElementById('alerta-presupuesto');
        const textoAlerta = document.getElementById('texto-alerta');
        alerta.classList.add('hidden');

        if (saldoRestante < 0) {
            balanceElement.className = 'text-danger';
            textoAlerta.innerText = "¡Peligro! Has excedido tu presupuesto inicial.";
            alerta.classList.remove('hidden');
        } else if (appData.gastosTotales >= appData.presupuestoTotal * 0.8) {
            balanceElement.className = 'text-warning';
            textoAlerta.innerText = "¡Cuidado! Te queda menos del 20% de tu dinero.";
            alerta.classList.remove('hidden');
        } else {
            balanceElement.className = 'text-success';
        }

        renderizarTabla(appData.gastos);
        actualizarGrafico();
    }

    function renderizarTabla(listaGastos) {
        const lista = document.getElementById('expense-list');
        lista.innerHTML = '';
        listaGastos.forEach(gasto => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td style="font-weight: 600;">${gasto.desc}</td>
                <td>${gasto.categoria}</td>
                <td><span style="background: #eee; padding: 5px 10px; border-radius: 20px; font-size: 0.85rem;">${gasto.metodo}</span></td>
                <td class="text-danger" style="font-weight: bold;">-$${gasto.monto.toLocaleString('es-MX', {minimumFractionDigits: 2})}</td>
            `;
            lista.appendChild(row);
        });
    }

    function filtrarTabla() {
        const filtro = document.getElementById('search-filter').value.toLowerCase();
        const filtrados = appData.gastos.filter(g => g.desc.toLowerCase().includes(filtro) || g.categoria.toLowerCase().includes(filtro));
        renderizarTabla(filtrados);
    }

    function actualizarGrafico() {
        const categorias = {};
        appData.gastos.forEach(g => {
            categorias[g.categoria] = (categorias[g.categoria] || 0) + g.monto;
        });

        const ctx = document.getElementById('expenseChart').getContext('2d');
        if (miGrafico) { miGrafico.destroy(); } 

        miGrafico = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(categorias),
                datasets: [{
                    data: Object.values(categorias),
                    backgroundColor: ['#ff9ff3', '#54a0ff', '#feca57', '#1dd1a1', '#ff6b6b', '#c8d6e5'],
                    borderWidth: 0,
                    hoverOffset: 10
                }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { font: { family: 'Poppins' } } }
                },
                cutout: '70%'
            }
        });
    }

    function compartirWhatsApp() {
        const saldoRestante = appData.presupuestoTotal - appData.gastosTotales;
        let texto = `🚀 *Mi Presupuesto ${appData.periodo}*%0A%0A`;
        texto += `🏦 *Total:* $${appData.presupuestoTotal.toFixed(2)}%0A`;
        texto += `📉 *Gastado:* $${appData.gastosTotales.toFixed(2)}%0A`;
        texto += `💵 *Restante:* $${saldoRestante.toFixed(2)}%0A%0A`;
        texto += `_Administrado desde mi Web App Personal_ 💻✨`;

        window.open(`https://api.whatsapp.com/send?text=${texto}`, '_blank');
    }

    function exportarCSV() {
        let csv = "Descripcion,Categoria,Metodo_Pago,Monto,Fecha\n";
        appData.gastos.forEach(g => {
            csv += `"${g.desc}","${g.categoria}","${g.metodo}",${g.monto},"${g.fecha}"\n`;
        });
        
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `gastos_${appData.periodo.toLowerCase()}.csv`;
        link.click();
    }

    function reiniciarApp() {
        if(confirm("⚠️ ¿Estás seguro de que deseas borrar todos los registros? Esta acción no se puede deshacer.")) {
            localStorage.removeItem('appPresupuestoPro');
            location.reload(); 
        }
    }
</script>

</body>
</html>
